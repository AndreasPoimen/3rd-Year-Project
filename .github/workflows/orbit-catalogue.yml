name: Refresh orbital catalogue
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/orbit-catalogue.yml'
      - 'scripts/update-orbits.mjs'
permissions:
  contents: write
concurrency:
  group: orbit-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate published elements
        run: node scripts/update-orbits.mjs
      - name: Verify orbit calculations
        run: node scripts/test-orbits.mjs
      - name: Preserve catalogue and update status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orbit-data/satnogs.json orbit-data/update-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh SatNOGS orbital catalogue'
            git push
          fi
