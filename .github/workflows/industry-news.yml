name: Collect industry headlines
on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/industry-news.yml'
      - 'scripts/update-industry-news.py'
permissions:
  contents: write
concurrency:
  group: orbit-catalogue
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect source headlines
        run: python scripts/update-industry-news.py
      - name: Save headlines and source health
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add industry-data/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update industry headline inbox'
            git push
          fi
